<div id="row-{{.Kind}}-{{.Name}}" class="card{{if .Child}} child{{end}}">
  <div class="content"><b>{{.Label}}</b><small>{{.Description}}</small>{{range .Actions}}<form class="run" method="post" action="/components/action"><input type="hidden" name="token" value="{{$.Token}}"><input type="hidden" name="kind" value="{{$.Kind}}"><input type="hidden" name="name" value="{{$.Name}}"><input type="hidden" name="action" value="{{.ID}}"><button class="small" type="submit">{{.Button}}</button></form>{{end}}{{range .Actions}}{{if .URL}}<small class="action"><a href="{{.URL}}" target="_blank" rel="noreferrer noopener">{{.LinkLabel}}</a> ({{.LinkNote}})</small>{{else if .Note.OK}}<small class="action"><span class="chip installed">Done</span></small>{{else if .Note.Text}}<small class="action err">{{.Button}}: {{.Note.Text}}</small>{{end}}{{end}}</div>
  <div class="meta"><span class="chip {{.Status}}">{{.Chip}}</span><form method="post" action="/components"><input type="hidden" name="token" value="{{.Token}}"><input type="hidden" name="kind" value="{{.Kind}}"><input type="hidden" name="name" value="{{.Name}}"><input type="hidden" name="enabled" value="{{.Enable}}"><button class="small" type="submit">{{.Button}}</button></form></div>
</div>
