<section>
<h2>Components</h2>
{{if .Err}}<div class="banner err">{{.Err}}</div>{{else}}
<p class="hint">Components run as user <b>{{.User}}</b> (<b>{{.Mode}}</b> install).</p>
<p class="hint">{{.Note}}</p>
{{range .Groups}}<h3>{{.Title}}</h3>
<div class="cards">
{{range .Rows}}{{template "component_row.html" .}}
{{end}}</div>
{{end}}{{if .Infra}}<p class="hint infra">{{.Infra}}</p>{{end}}
{{end}}</section>
