# nfpm packages the cross-compiled binary per architecture (make deb).
# VERSION, NFPM_ARCH and BINARY_PATH come from the Makefile via envsubst.
# version_schema semver turns 0.1.0-beta.8 into the deb version 0.1.0~beta.8,
# keeping the apt upgrade path continuous into the final 0.1.0.
name: odioctl
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: admin
priority: optional
maintainer: "Mathieu Réquillart <mathieu.requillart@gmail.com>"
homepage: "https://github.com/b0bbywan/odioctl"
license: "BSD-2-Clause"
description: |
  system control for odio: upgrades, components, DAC, web UI
  odioctl drives an odio installation from the command line and from a small
  LAN web UI:
  .
   * odioctl upgrade check|apply|verify — the odios upgrade path (state.json
     vs published manifest, INSTALL_*/RUN_* derivation, install.sh re-run),
     wired to the odio-check-upgrade timer and odio-upgrade service;
   * odioctl components — opt roles and features in or out of the next upgrade;
   * odioctl dac — pick the DAC dtoverlay in the Raspberry Pi config.txt;
   * odioctl web — stdlib HTTP server with a plain-HTML page for the above.
  .
  Ships systemd --user units (not auto-enabled) and a sudoers fragment
  granting the `odioctl` system group the exact privileged commands it needs.
  That group is created here and left empty: odios adds its target user to it.

depends:
  - adduser
  - sudo
recommends:
  - curl

contents:
  - src: ${BINARY_PATH}
    dst: /usr/bin/odioctl
    file_info:
      mode: 0755
  - src: data/systemd/user/*
    dst: /usr/lib/systemd/user/
  # One explicit rule per DAC id, generated by `go generate ./dac` — 0440 as
  # sudo insists.
  - src: data/sudoers/odioctl
    dst: /etc/sudoers.d/odioctl
    file_info:
      mode: 0440
  - src: debian/copyright
    dst: /usr/share/doc/odioctl/copyright

scripts:
  postinstall: debian/postinst
