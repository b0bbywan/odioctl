[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odioctl"
dynamic = ["version"]
description = "odio system control: upgrades, components, DAC overlay and a local web UI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mathieu Réquillart" }]
requires-python = ">=3.11"
# The core is stdlib-only on purpose: it ships as a Debian package on a
# Raspberry Pi appliance and must not drag a dependency tree with it.
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/b0bbywan/odioctl"
Documentation = "https://docs.odio.love"

[project.scripts]
odioctl = "odioctl.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.hatch.version]
path = "src/odioctl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/odioctl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
warn_return_any = true
